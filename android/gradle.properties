# Properties of the Android build (`./gradlew -p android ...`). android/ is its own Gradle
# build, so the repository-root gradle.properties is not read here.

# AGP 9's built-in Kotlin support adds org.jetbrains.kotlin:kotlin-stdlib to the app's `api`
# configuration unless this Kotlin Gradle plugin property says otherwise (AGP honours it in
# KgpUtils.maybeAddKotlinStdlibDependency). The project has no Kotlin sources and no class on
# the runtime classpath references kotlin/* (M10 measurement: 0 Lkotlin/ references from
# non-Kotlin classes in classes.dex), so the stdlib only inflated the release APK — 3,588,389
# to 1,522,607 bytes, classes.dex 2136 to 1057 classes, plus eight kotlin/*.kotlin_builtins
# entries. The compile*Kotlin tasks stay (NO-SOURCE), so build.gradle's task wiring is
# unchanged. android.builtInKotlin=false would remove them too, but that option is deprecated
# (removed in AGP 10.0), while this property is the plugin's stable contract.
kotlin.stdlib.default.dependency=false
