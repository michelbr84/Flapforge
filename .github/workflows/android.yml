name: Android

# Milestone M10: the Android port builds separately from the desktop build
# (`./gradlew -p android ...`, AGP 9.4.0 on the same Gradle 9.7.1 wrapper).
# It rewrites src/main/java against the shim packages (transformSources, double
# integrity gate), compiles the APK and runs the Robolectric unit tests. The
# desktop workflows (build.yml, test.yml) never see the android/ project.
on:
  push:
    branches: ['**']
    paths:
      - 'android/**'
      - 'src/main/**' # transformSources input (java) and the bundled resources
      - 'gradlew'
      - 'gradle/wrapper/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'src/main/**'
      - 'gradlew'
      - 'gradle/wrapper/**'
      - '.github/workflows/android.yml'

permissions:
  contents: read
  checks: write        # JUnit check run
  pull-requests: write # annotations on PRs

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Transform, APK and unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install the Android SDK components
        # ubuntu-latest (Ubuntu 24.04, image 20260823.283.1) ships the SDK at
        # ANDROID_HOME=/usr/local/lib/android/sdk with cmdline-tools 12.0 under
        # cmdline-tools/latest, platforms android-34 .. android-37.2 and build-tools
        # 34.0.0 .. 37.0.0 (source: actions/runner-images, images/ubuntu/Ubuntu2404-Readme.md
        # "Android" table; the layout comes from images/ubuntu/scripts/build/install-android-sdk.sh).
        # The install below is a no-op on that image; it is explicit so a future image that
        # drops android-36 or build-tools 36.0.0 (compileSdk 36, AGP 9.4.0) still produces the
        # same APK. No local.properties is checked in: AGP reads ANDROID_HOME.
        shell: bash
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null || true # `yes` dies of SIGPIPE; not an error
          "$sdkmanager" --install "platforms;android-36" "build-tools;36.0.0"
          "$sdkmanager" --list_installed | grep -E 'platforms;android-36 |build-tools;36\.0\.0 '

      - name: Transform, assemble the release APK and run the unit tests
        run: ./gradlew -p android transformSources assembleRelease test --stacktrace

      - name: Transform self-test (the integrity gate must bite)
        # `-PtransformSelfTest=breakForward` drops rules T2 and T4a from the rewrite, so gate (b)
        # must fail the task on two survivors: render/AssetManager.java's javax.imageio import
        # and content/StrictBinder.java's java.lang.reflect.RecordComponent import (the M10
        # hotfix's record shim). A build that passes here would mean the gate no longer guards
        # the transform; a failure for any other reason (SDK, Gradle) is not accepted as proof
        # either, nor is a gate failure that does not name both survivors (a self-test that
        # quietly stopped dropping one rule). The poisoned output tree it leaves behind is
        # rebuilt from scratch by the next plain transformSources run.
        shell: bash
        run: |
          set +e
          ./gradlew -p android transformSources -PtransformSelfTest=breakForward 2>&1 | tee android/build/transform-selftest.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 0 ]; then
            echo "::error::transformSources succeeded with -PtransformSelfTest=breakForward; the integrity gate no longer bites"
            exit 1
          fi
          grep -q 'INTEGRITY GATE FAILED' android/build/transform-selftest.log || {
            echo "::error::transformSources failed, but not on the integrity gate (see the log above)"
            exit 1
          }
          for survivor in 'render/AssetManager\.java:[0-9]+: import javax\.imageio\.' \
                          'content/StrictBinder\.java:[0-9]+: import java\.lang\.reflect\.RecordComponent;'; do
            grep -q -E "$survivor" android/build/transform-selftest.log || {
              echo "::error::the integrity gate failed without reporting the survivor '$survivor' (breakForward no longer drops that rule)"
              exit 1
            }
          done
          echo 'gate bites on both survivors'

      - name: Upload the release APK
        uses: actions/upload-artifact@v7
        with:
          name: flapforge-android-apk
          path: android/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish JUnit report
        if: always()
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: 'android/build/test-results/**/*.xml'
          check_name: Android JUnit report
          require_tests: false
          detailed_summary: true

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-test-reports
          path: |
            android/build/reports/tests
            android/build/test-results
          if-no-files-found: ignore
