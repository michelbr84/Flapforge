name: Release

# Runs on a v* tag only (M9): builds and tests once per OS, packages each OS
# with jpackage through scripts/package.sh (per-OS icon, E9), zips the app
# images and attaches them — with the fat jar — to the GitHub release.
# Since M10 the Android APK (android/, debug-signed sideload build) is built in
# parallel and attached as Flapforge-<version>-android.apk.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  package:
    name: Package ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Read the version
        id: version
        shell: bash
        run: echo "version=$(sed -n 's/^version=//p' src/main/resources/version.properties)" >> "$GITHUB_OUTPUT"

      - name: Build, test, export icons and package
        shell: bash
        run: |
          ./gradlew build fatJar iconExport --stacktrace
          bash scripts/package.sh

      - name: Zip the app image (Linux)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          cd build/dist
          zip -qr "../Flapforge-${{ steps.version.outputs.version }}-linux.zip" Flapforge

      - name: Zip the app image (macOS)
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          cd build/dist
          zip -qry "../Flapforge-${{ steps.version.outputs.version }}-macos.zip" Flapforge.app

      - name: Zip the app image (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: Compress-Archive -Path build/dist/Flapforge -DestinationPath build/Flapforge-${{ steps.version.outputs.version }}-windows.zip

      - name: Upload the app image bundle
        uses: actions/upload-artifact@v7
        with:
          name: flapforge-${{ matrix.os }}
          path: build/Flapforge-*.zip
          if-no-files-found: error

      - name: Upload the fat jar (once, from Linux)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: flapforge-jar
          path: build/libs/flapforge-*-all.jar
          if-no-files-found: error

  android:
    name: Package Android
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Read the version
        id: version
        shell: bash
        run: echo "version=$(sed -n 's/^version=//p' src/main/resources/version.properties)" >> "$GITHUB_OUTPUT"

      - name: Install the Android SDK components
        # Same components as android.yml (see the runner-image note there): compileSdk 36
        # and the build-tools AGP 9.4.0 resolves; a no-op on the current ubuntu-latest image.
        shell: bash
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null || true # `yes` dies of SIGPIPE; not an error
          "$sdkmanager" --install "platforms;android-36" "build-tools;36.0.0"
          "$sdkmanager" --list_installed | grep -E 'platforms;android-36 |build-tools;36\.0\.0 '

      - name: Build, test and name the APK
        # The APK file name carries the desktop version (version.properties); the
        # versionName baked into the APK comes from android/build.gradle, so the two
        # must agree before the file is renamed.
        shell: bash
        run: |
          version='${{ steps.version.outputs.version }}'
          if ! grep -qF "versionName = '${version}'" android/build.gradle; then
            echo "::error::android/build.gradle versionName does not match version.properties (${version})"
            exit 1
          fi
          ./gradlew -p android assembleRelease test --stacktrace
          shopt -s nullglob
          apks=(android/build/outputs/apk/release/*.apk)
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one release APK, found ${#apks[@]}: ${apks[*]}"
            exit 1
          fi
          mkdir -p build
          mv "${apks[0]}" "build/Flapforge-${version}-android.apk"

      - name: Upload the APK
        uses: actions/upload-artifact@v7
        with:
          name: flapforge-android
          path: build/Flapforge-*-android.apk
          if-no-files-found: error

  release:
    name: Attach the bundles to the release
    needs: [package, android]
    runs-on: ubuntu-latest
    steps:
      - name: Download all bundles
        uses: actions/download-artifact@v8
        with:
          pattern: flapforge-*
          path: bundles
          merge-multiple: true

      - name: Attach to the GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: bundles/*
          fail_on_unmatched_files: true
