version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    labels: [dependencies, ci]
    # One grouped PR for every action bump: the actions are used pairwise (upload/download)
    # and a burst of six separate PRs is what amplified the CI smoke flake during M10-pre.
    groups:
      github-actions:
        patterns: ['*']

  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    labels: [dependencies, gradle]
    groups:
      junit:
        patterns: ['org.junit*']
